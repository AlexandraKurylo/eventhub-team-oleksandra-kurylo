openapi: 3.1.0

info:
  title: EventHub API
  version: 0.1.0
  description: Портал продажу квитків на події

servers:
  - url: http://localhost:4010
    description: Мок-сервер Prism
  - url: http://localhost:3000
    description: Локальний api-gateway

paths:
  /events:
    get:
      operationId: listEvents
      summary: Список подій із курсорною пагінацією
      tags: [catalog]
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            examples: [Вінниця]
        - name: from
          in: query
          required: false
          description: Показати події, що починаються не раніше цієї дати
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          description: Непрозорий курсор із попередньої відповіді
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Сторінка подій
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              examples:
                filled:
                  summary: Сторінка з подіями
                  value:
                    items:
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                        title: Симфонічний вечір
                        startsAt: "2026-10-12T19:00:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                          name: Філармонія
                          city: Вінниця
                        minPrice: { amount: 25000, currency: UAH }
                        availableSeats: 143
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8ea0
                        title: Джазовий квартет
                        startsAt: "2026-10-19T20:00:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e01
                          name: Клуб «Підвал»
                          city: Вінниця
                        minPrice: { amount: 18000, currency: UAH }
                        availableSeats: 12
                    nextCursor: "MjAyNi0xMC0xOVQyMDowMDowMFo"
                empty:
                  summary: Порожній каталог
                  value:
                    items: []
                    nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"

  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Одна подія
      tags: [catalog]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Подія
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                default:
                  value:
                    id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    title: Симфонічний вечір
                    description: Програма з творів Лисенка та Дворжака
                    startsAt: "2026-10-12T19:00:00Z"
                    venue:
                      id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                      name: Філармонія
                      city: Вінниця
                    minPrice: { amount: 25000, currency: UAH }
                    availableSeats: 143
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    post:
      operationId: createOrder
      summary: Створення нового замовлення (бронювання квитків)
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Замовлення успішно створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

        # 409 Conflict: Запит синтаксично правильний, але стан ресурсу змінився (конкуренція).
        # Повторювати одразу сенсу немає, доки інший покупець утримує або купує місце.
        # Проте згодом (після закінчення таймеру броні) статус ресурсу може змінитися на успішний.
        "409":
          description: Конфлікт ресурсів (місце вже утримується або зайняте)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                seatAlreadyHeld:
                  value:
                    type: /errors/seat-conflict
                    title: Місце зайняте
                    status: 409
                    detail: Обране місце вже утримується або придбане іншим покупцем.

        # 410 Gone: Подія скасована організатором. Доступ до ресурсу постійно закритий.
        # Повторювати запит через хвилину, годину чи день немає сенсу — стан фінальний і термінальний.
        "410":
          description: Подія скасована
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                eventCancelled:
                  value:
                    type: /errors/event-cancelled
                    title: Подію скасовано
                    status: 410
                    detail: Подія була скасована організатором і більше недоступна для замовлення.

    get:
      operationId: listOrders
      summary: Перегляд списку замовлень поточного користувача
      tags: [orders]
      responses:
        "200":
          description: Список замовлень
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Перегляд деталей конкретного замовлення
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Деталі замовлення
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Скасування замовлення
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Замовлення успішно скасовано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        # 403 Forbidden: Клієнт автентифікований, але намагається скасувати чуже замовлення.
        # Повторення запиту через хвилину не змінить прав доступу користувача автоматично.
        "403":
          description: Доступ заборонено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                forbiddenCancellation:
                  value:
                    type: /errors/forbidden
                    title: Недостатньо прав
                    status: 403
                    detail: Ви не можете скасувати чуже замовлення.

        "404":
          $ref: "#/components/responses/NotFound"

        # 409 Conflict: Замовлення вже було скасоване або завершене раніше (конфлікт станів).
        # Повторювати той самий запит на скасування вже не потрібно.
        "409":
          description: Конфлікт стану замовлення
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                alreadyCancelled:
                  value:
                    type: /errors/order-state-conflict
                    title: Неможливо скасувати замовлення
                    status: 409
                    detail: Замовлення вже було скасоване або завершене раніше.

components:
  schemas:
    Event:
      type: object
      required: [id, title, startsAt, venue, minPrice, availableSeats]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        venue: { $ref: "#/components/schemas/VenueSummary" }
        minPrice: { $ref: "#/components/schemas/Money" }
        availableSeats: { type: integer, minimum: 0 }

    VenueSummary:
      type: object
      required: [id, name, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }

    Money:
      type: object
      required: [amount, currency]
      description: Сума в мінімальних одиницях валюти (копійках)
      properties:
        amount: { type: integer }
        currency: { type: string, enum: [UAH] }

    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        nextCursor:
          type: [string, "null"]
          description: Курсор наступної сторінки; null — сторінок більше немає

    Order:
      type: object
      required: [id, eventId, status, createdAt, totalPrice]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, cancelled] }
        createdAt: { type: string, format: date-time }
        totalPrice: { $ref: "#/components/schemas/Money" }

    CreateOrderRequest:
      type: object
      required: [eventId, seatIds]
      properties:
        eventId: { type: string, format: uuid }
        seatIds:
          type: array
          items: { type: string, format: uuid }

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

  responses:
    BadRequest:
      description: Некоректні параметри запиту
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidLimit:
              value:
                type: /errors/invalid-query
                title: Некоректний параметр запиту
                status: 400
                detail: "Параметр limit має бути в межах 1..50"

    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            eventNotFound:
              value:
                type: /errors/not-found
                title: Подію не знайдено
                status: 404
